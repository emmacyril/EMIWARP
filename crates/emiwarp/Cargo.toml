[package]
name = "emiwarp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

# The local agent server. `warp_multi_agent_api` is upstream's own protocol
# crate, so the shim speaks exactly what the client expects rather than an
# approximation of it.
axum.workspace = true
base64.workspace = true
futures.workspace = true
prost.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "process", "io-util", "time"] }
uuid = { workspace = true, features = ["v4"] }
warp_multi_agent_api.workspace = true

[features]
default = []
